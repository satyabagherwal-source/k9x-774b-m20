name: 24-7 Zero-Clone Autonomous Harvester with Google Gemini AI

on:
  schedule:
    # Runs every 2 hours continuously in GitHub cloud (24/7/365 - Even when laptop is turned OFF)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Web UI
  push:
    paths:
      - 'repos.txt'
      - 'harvest-control.json'

permissions:
  contents: write

jobs:
  cloud-harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Builder-Brain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git Identity
        run: |
          git config --global user.name "AI-Builder-Brain-Cloud-Agent"
          git config --global user.email "cloud-agent@ai-builder-brain.local"

      - name: Verify Server-to-Server Gemini AI Connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=GEMINI_API_KEY Missing::To enable deep 24/7 AI reasoning, add your FREE Google AI Studio API key as a secret named 'GEMINI_API_KEY' in: https://github.com/${{ github.repository }}/settings/secrets/actions"
          else
            echo "✅ GEMINI_API_KEY detected. Autonomous Server-to-Server Gemini AI engine is ready."
          fi

      - name: Execute Zero-Clone Harvester with Server-to-Server Google Gemini AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node 04_WORKFLOWS/factory-engine/zero-clone-harvester.mjs

      - name: Commit & Push Harvested Intelligence to GitHub
        run: |
          git config user.name "AI-Builder-Brain-Cloud-Agent"
          git config user.email "cloud-agent@ai-builder-brain.local"
          git add .
          if git diff --staged --quiet; then
            echo "No new intelligence to commit."
          else
            git commit -m "feat(brain): 24/7 Gemini server-to-server AI learning harvest [skip ci]"
            git push origin main
          fi
