name: 24-7 Zero-Clone Autonomous Harvester

on:
  schedule:
    # Runs every 2 hours continuously in GitHub cloud (24/7/365 - Even when laptop is turned OFF)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Web UI
  push:
    paths:
      - 'repos.txt'
      - 'harvest-control.json'

permissions:
  contents: write

jobs:
  cloud-harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AI-Builder-Brain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Zero-Clone API Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node 04_WORKFLOWS/factory-engine/zero-clone-harvester.mjs

      - name: Commit & Push Harvested Intelligence to GitHub
        run: |
          git config user.name "AI-Builder-Brain-Cloud-Agent"
          git config user.email "cloud-agent@ai-builder-brain.local"
          git add .
          if git diff --staged --quiet; then
            echo "No new intelligence to commit."
          else
            git commit -m "feat(brain): 24/7 cloud zero-clone harvest [skip ci]"
            git push origin main
          fi
