<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Reading View | The Sovereign Chronicle</title>
  <meta name="description" content="Read full technical monograph from The Sovereign Chronicle.">
  <link rel="canonical" href="https://chronicle.ai-builder-brain.local/article.html">
  <link rel="alternate" type="application/feed+json" title="The Sovereign Chronicle JSON Feed" href="./data/feed.json">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="./data/sitemap.xml">
  <link rel="stylesheet" href="./styles/main.css">

  <!-- OpenGraph Metadata -->
  <meta property="og:site_name" content="The Sovereign Chronicle">
  <meta property="og:type" content="article">

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Schema.org JSON-LD Placeholder -->
  <script type="application/ld+json" id="structured-data-jsonld">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "The Sovereign Chronicle Article View"
  }
  </script>
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="sr-only focus:not-sr-only btn btn-primary" style="position: absolute; top: 1rem; left: 1rem; z-index: 110;">
    Skip to main content
  </a>

  <!-- Reading Progress Bar (Fixed Top) -->
  <div class="reading-progress-wrapper" aria-hidden="true">
    <div id="reading-progress-bar" class="reading-progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
  </div>

  <!-- Screen Reader Announcer -->
  <div id="aria-live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a href="/" class="brand-wrapper" id="brand-link" aria-label="Return to Chronicle Homepage">
        <div class="brand-logo-icon">SC</div>
        <div>
          <span class="brand-title">The Sovereign Chronicle</span>
        </div>
      </a>

      <!-- Theme Switcher -->
      <nav class="theme-switcher-nav" aria-label="Reading Mode Settings">
        <span class="sr-only">Choose Reading Theme:</span>
        <button type="button" class="theme-btn" data-theme-set="light" aria-pressed="false" title="Light Theme">Light</button>
        <button type="button" class="theme-btn active-theme" data-theme-set="dark" aria-pressed="true" title="Dark Theme">Dark</button>
        <button type="button" class="theme-btn" data-theme-set="sepia" aria-pressed="false" title="Sepia Theme">Sepia</button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container" role="main">
    <!-- Hidden home view placeholder for router state parity -->
    <div id="home-view" class="hidden">
      <div id="category-pills"></div>
      <div id="article-grid"></div>
    </div>

    <!-- Active Article View -->
    <div id="article-view">
      <div id="article-container">
        <!-- Rendered by app.js on load -->
        <div class="empty-state card" role="status">
          <p>Loading publication monograph...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <div>
        <p><strong>The Sovereign Chronicle</strong> • Universal Construction Intelligence Demonstration (PAC-002)</p>
      </div>
      <nav class="footer-nav" aria-label="Footer Links">
        <a href="/" class="footer-link">Home</a>
        <a href="./data/feed.json" class="footer-link" target="_blank" rel="noopener">Feed</a>
        <a href="./data/sitemap.xml" class="footer-link" target="_blank" rel="noopener">Sitemap</a>
      </nav>
    </div>
  </footer>

  <script type="module">
    import { ChronicleApp } from './lib/app.js';

    const app = new ChronicleApp({
      homeView: document.getElementById('home-view'),
      articleView: document.getElementById('article-view'),
      articleContainer: document.getElementById('article-container'),
      articleGrid: document.getElementById('article-grid'),
      categoryPillsContainer: document.getElementById('category-pills'),
      progressBar: document.getElementById('reading-progress-bar')
    });

    app.init();
    window.__chronicleApp = app;
  </script>
</body>
</html>
