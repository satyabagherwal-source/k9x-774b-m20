version: '3.8'

services:
  incidentlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-lens-app
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3456
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 24M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3456/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

